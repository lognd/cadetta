[package]
name = "cadetta"
description = "Typed, toleranced design parameters for CAD: one source of truth, linted, emitted to every CAD tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["cad", "parameters", "tolerance", "units", "lint"]
categories = ["science", "development-tools", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "cadetta"
path = "src/main.rs"

[[test]]
name = "conformance_quantities"
path = "../../tests/conformance_quantities.rs"

[[test]]
name = "conformance_language"
path = "../../tests/conformance_language.rs"

[[test]]
name = "conformance_ir"
path = "../../tests/conformance_ir.rs"

[[test]]
name = "conformance_obligations"
path = "../../tests/conformance_obligations.rs"

[[test]]
name = "conformance_config_cli"
path = "../../tests/conformance_config_cli.rs"

[[test]]
name = "conformance_adapters"
path = "../../tests/conformance_adapters.rs"

[[test]]
name = "conformance_solvers"
path = "../../tests/conformance_solvers.rs"

[[test]]
name = "conformance_stdlib"
path = "../../tests/conformance_stdlib.rs"

[[test]]
name = "conformance_lints"
path = "../../tests/conformance_lints.rs"

[[test]]
name = "conformance_geometry"
path = "../../tests/conformance_geometry.rs"

[[test]]
name = "conformance_emitters_json"
path = "../../tests/conformance_emitters_json.rs"

[[test]]
name = "conformance_emitters_csv"
path = "../../tests/conformance_emitters_csv.rs"

[[test]]
name = "conformance_packages"
path = "../../tests/conformance_packages.rs"

[[test]]
name = "std_s001"
path = "gates/std_s001.rs"

[dependencies]
cadetta-adapter.workspace = true
cadetta-ir.workspace = true
cadetta-log.workspace = true
cadetta-lint.workspace = true
cadetta-obligations.workspace = true
cadetta-sema.workspace = true
cadetta-solve.workspace = true
cadetta-syntax.workspace = true
cadetta-units.workspace = true
cadetta-variants.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
blake3 = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
lsp-server = "0.7"
lsp-types = "0.95"
crossbeam-channel = "0.5.17"
jsonschema = { version = "0.58", default-features = false }

[dev-dependencies]
regex = "1"

[lints]
workspace = true
