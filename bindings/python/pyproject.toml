# The PyPI distribution `cadetta`: the importable Python package (interop
# API, docs/spec/bindings.md) on a Rust core (src/, PyO3), plus
# the `cadetta` console script, which runs the same Rust CLI. The version
# is read from the Cargo package, so there is no second version to drift.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cadetta"
dynamic = ["version"]
description = "Typed, toleranced design parameters for CAD: one source of truth, linted, emitted to every CAD tool."
readme = "../../README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Logan Dapp" }]
keywords = ["cad", "parameters", "tolerance", "units", "lint"]
dependencies = ["pydantic>=2", "typani>=0.2.3"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
pint = ["pint>=0.24"]

[project.scripts]
cadetta = "cadetta.__main__:main"

[project.urls]
Homepage = "https://github.com/lognd/cadetta"
Repository = "https://github.com/lognd/cadetta"
Documentation = "https://github.com/lognd/cadetta/tree/main/docs/spec"
Changelog = "https://github.com/lognd/cadetta/blob/main/CHANGELOG.md"
Issues = "https://github.com/lognd/cadetta/issues"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "maturin>=1.9,<2",
    "pint>=0.24",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "cadetta._core"
bindings = "pyo3"
features = ["pyo3/extension-module"]
strip = true
include = [
    { path = "python/cadetta/logging/config.toml", format = ["sdist", "wheel"] },
    { path = "python/cadetta/logging/protocol.toml", format = ["sdist", "wheel"] },
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"python/cadetta/models/**" = ["E501"]  # generated; descriptions are long
