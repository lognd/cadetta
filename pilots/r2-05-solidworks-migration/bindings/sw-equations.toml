# Written by `cadetta import sw-equations ../05-solidworks-migration/legacy-equations.txt --assume-unit mm`; accepted by the user.
# Keys are IMPORT-TIME canonical paths. cleaned.cdt renames/merges members with `was`,
# which carries each binding forward (adapters.md 3), so no key is orphaned (R005 silent).
# Importer rule for `mode`: a dimension whose native expression is a pure global reference
# is proposed `ref`; a literal or a formula is `value`; a global-variable locator is `value`
# (a global is already the thing a ref points at).
# PROPOSED: several keys (Plate_Thk, "plate thickness", D1@Boss-Extrude1@CoverPlate) resolve to
# ONE path after cleanup. adapters.md 3 says one table per path; I key by import path and let
# `was` fan them in. A `ref` dimension points at the FIRST global locator of its path in file order.
# native_unit is the unit the emitted number is written in (document unit mm unless stated).

