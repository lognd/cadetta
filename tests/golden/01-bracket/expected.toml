# Hand-evaluated against spec draft 1.4. Std table figures are assumed
# (stdlib.md 2 names columns, not values): Iso273 medium M4 4.5mm and M5
# 5.5mm; Thread major M4 4mm and M5 5mm; Iso4762Head counterbore M4
# 8mm x 4.4mm and M5 9.5mm x 5.4mm; TapDrill cut_75 M4 3.3mm and M5 4.2mm;
# Al6061T6 engagement factor 2.0 and tap class Soft; Iso4762Len contains 16mm.
# Policy-dependent joint members (thread_depth, drill_depth, callout) and the
# mass roll-up are not pinned: IsoDefault and the screw masses are unspecified.

[case]
spec = "1.5"
status = "hand-evaluated"
exercises = ["quantities.md 5.3", "quantities.md 5.4", "language.md 3.1", "language.md 3.7", "stdlib.md 3", "geometry.md 2", "geometry.md 4", "geometry.md 5"]

# ---- tube, fit ------------------------------------------------------
[[value]]
path = "acme.bracket::parts::Tube.od"
nominal = "20mm"
min = "19.87mm"
max = "20mm"
note = "h11 shaft, IT11 for 18-30mm is 0.130mm"

[[value]]
path = "acme.bracket::Bracket.tube_seat.hole"
nominal = "20mm"
min = "20mm"
max = "20.13mm"
note = "H11 on the tube nominal"

[[value]]
path = "acme.bracket::Bracket.tube_seat.shaft"
