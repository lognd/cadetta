# ---- verdicts -------------------------------------------------------
[[verdict]]
path = "acme.bracket::Bracket.bore_fits_tube"
result = "holds"          # clearance in [0, 0.26] mm, 0 >= 0

[[verdict]]
path = "acme.bracket::WallTubeMount.mount_edge_distance"
result = "holds"          # [11.9, 12.1] >= 11

[[verdict]]
path = "acme.bracket::WallTubeMount.mount_cb_edge"
result = "holds"          # [11.9, 12.1] > 4.75

[[verdict]]
path = "acme.bracket::WallTubeMount.mount_cb_overlap"
result = "holds"          # [31.9, 32.1] > 9.5

[[verdict]]
path = "acme.bracket::WallTubeMount.mount_hole_clears_fillet"
result = "holds"          # 55 - 4.75 = 50.25 >= 15

[[verdict]]
path = "acme.bracket::WallTubeMount.clamp_edge"
result = "holds"          # 9.75 >= 9

# Joint alignment (geometry.md 5): allowance 0.25mm. Mount pairs differ by
# at most 0.1mm in x (pitch variables of both patterns, halved), 0 in y.
[[verdict]]
path = "acme.bracket::WallTubeMount/mount_screws.aligned"
result = "holds"
conservative = true

# Clamp pairs differ by at most 0.1mm per axis: distance <= 0.1414mm.
[[verdict]]
path = "acme.bracket::WallTubeMount/clamp_screws.aligned"
result = "holds"
conservative = true

