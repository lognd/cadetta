# Hand-evaluated against spec draft 1.4. Std table figures are assumed
# (stdlib.md 2 names columns, not values): Iso273 medium M3 3.4mm; Thread
# major M3 3mm; Al6061T6 density 2700 kg/m^3; Steel1018 engagement factor
# 1.0; Iso4762Len contains 8mm, 10mm, 12mm. gn = 9.80665 m/s^2. Values that
# depend on transcendental functions are pinned to the digits shown with a
# note. Not pinned: the joint's thread_depth, its depth_available check and
# its internal engagement/bottoming checks (they depend on IsoDefault's
# bottom_clearance, unspecified in stdlib.md 4), and the mass roll-up (rails,
# screw, drive and the made parts have no mass, so it is a list of missing).

[case]
spec = "1.4"
status = "hand-evaluated"
exercises = ["config-cli.md 1", "language.md 3.2", "language.md 3.5", "language.md 3.7", "quantities.md 4.3", "quantities.md 5.4", "stdlib.md 3", "stdlib.md 6", "geometry.md 3", "geometry.md 4", "geometry.md 5", "lints.md 2.1"]

