# ---- diagnostics -----------------------------------------------------

# The list of errors and warnings is closed. The journal fit is undecided
# (C002), and the waiver on it suppresses that. The project has no
# cadetta.lock, so the waiver has never been reviewed: its review is an
# open `waiver` obligation (O002), not a stale one (lints.md 2.1). No
# I004: Actuator is the only root and has no parameters. No N006:
# parameterized parts are read through their instances
# (screw.cut_increment, rail.stock_step, carriage.length). Info
# diagnostics (D001 on small literals, U001) are not compared.

[[diagnostic]]
code = "O002"
path = "acme.actuator::Actuator.journal"
note = "waiver:acme.actuator::Actuator.journal, never acknowledged"
