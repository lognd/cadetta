# Verdicts.

[[verdict]]
path = "acme.bearing_housing::BearingUnit/seat_creep"
result = "undecided"
conservative = false
note = "bore - seat in [-12um, +2um], both instances; j5 can be loose"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/seat_squeeze"
result = "undecided"
conservative = false
note = "4/5 x (seat - bore) in [-1.6um, +9.6um] vs radial_clearance.min 2um"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/housing_not_pinched"
result = "holds"
conservative = false
note = "bore_dia - outer_dia in [0, 0.03mm], both instances"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/shoulder_supports_ring"
result = "holds"
conservative = false
note = "min 10.89mm >= 10mm"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/shoulder_clears_seal"
result = "holds"
conservative = false
note = "max 11mm < 12.6mm"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/housing_shoulder_ok"
result = "holds"
conservative = false
note = "max 19.1mm <= 20mm"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/ring_size_ok"
result = "holds"
conservative = false
note = "22mm == 22mm on nominals"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/groove_edge_ok"
result = "holds"
conservative = false
note = "3mm >= 1.5mm"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/axial_play_ok"
result = "undecided"
conservative = false
note = "axial_play in [0, 0.64mm]; 0 <= x holds, x <= 0.5mm does not; linear, so not conservative"

[[verdict]]
path = "acme.bearing_housing::BearingUnit/shaft.seats_coaxial"
result = "holds"
conservative = false
note = "radial sup = 0.01mm x sqrt(2) = 0.01414mm <= 0.02mm; the square-aware interval is the exact range over the tolerance box, so not conservative (unlike aligned, geometry.md 5)"

