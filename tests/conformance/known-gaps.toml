# Fixtures whose implementation lags the spec. The runner tolerates a listed
# fixture's failure, and fails when a listed fixture starts passing (remove
# the entry then). Every entry needs a ticket handle and a reason.
#
# [[gap]]
# fixture = "quantities/q006"   # <doc>/<NAME>
# ticket = "~ABCDEFG"           # ticket that closes the gap
# reason = "Q006 not emitted for inexact pi products yet"

[[gap]]
fixture = "obligations/o003-require-signoff-open"
ticket = "~Y0NVZAF"
reason = "CLI obligation universe does not enumerate require obligations, so O003 never fires"

[[gap]]
fixture = "obligations/s004-citation-changed"
ticket = "~Y0NVZAF"
reason = "CLI obligation universe does not enumerate ots/citation obligations, so S004 never fires"

[[gap]]
fixture = "obligations/w003-waive-require"
ticket = "~SN4G7QS"
reason = "waive naming a require diagnostic suppresses it instead of raising W003"

[[gap]]
fixture = "obligations/w003-allow-require"
ticket = "~SN4G7QS"
reason = "allow on a require raises no W003, and allow does not suppress C001 on a check either"

[[gap]]
fixture = "obligations/s003-solver-stale"
ticket = "~JET4TC0"
reason = "solver member declarations are unresolved (E002) in check, so S003 never fires"
