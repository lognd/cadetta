body = "solvers.md 4.1: a missing primary result is an unsolved output, not S006. variant_outputs (pipeline.rs) calls read_variant, which returns Unknown whenever the variant has no entry, so a project with no sizing.out.json at all raises S006 per alternate. Fix: skip the S006 push when the primary has no stored result (site.results.lookup(&site.key, None, ..) is Missing). The fixture's must-not-fire also needs C002 (the check reads an unknown output) listed in expect.json. Found while working ~QH5PDHZ; pipeline.rs is leased by ~3RK3GPH/C0B2X17."
