body = "Follow-up to ~CH5HR2K. In kindcheck.rs, locals only holds locals whose type is known, so an untyped let/for variable sharing a name with a quantity member resolves to that member and can produce a false Q002. Record unknown-typed locals as shadows so lookup stops at them."
