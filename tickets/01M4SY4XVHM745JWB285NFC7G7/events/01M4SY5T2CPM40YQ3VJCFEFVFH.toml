body = "Owner decision: frob bans logging setup outside gob-log. So new crate cadetta-log owns subscriber init (CADETTA_LOG, -v levels, JSON/text, redaction) exactly like frob-v2 crates/gob-log. cadetta-cli and bindings/python depend on it and never touch tracing_subscriber. Add a frob policy rule banning tracing_subscriber and print macros outside cadetta-log (see how frob-v2 enforces it). Add the crate to design/model.grmb and docs. Remove init_logging from cadetta-cli main.rs."
